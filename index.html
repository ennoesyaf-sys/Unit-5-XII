<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mazaya English Programme — Workbook Companions</title>
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#1f2a23; --sub:#55645a; --accent:#3f7a52; --line:#dde3dc;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15201a; --card:#1d2a22; --ink:#eef2ee; --sub:#9db2a6; --accent:#6fbf86; --line:#2c3b32; }
}
:root[data-theme="dark"]{ --bg:#15201a; --card:#1d2a22; --ink:#eef2ee; --sub:#9db2a6; --accent:#6fbf86; --line:#2c3b32; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
header{max-width:720px;margin:0 auto;padding:28px 16px 10px;text-align:center}
h1{font-size:1.4rem;margin:0 0 6px}
.sub{color:var(--sub);font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.card h2{margin:0 0 4px;font-size:1.05rem;color:var(--accent)}
.card p{margin:4px 0 12px;color:var(--sub);font-size:.88rem}
.links a{display:inline-block;margin-right:10px;margin-bottom:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-size:.85rem}
.links a.primary{background:var(--accent);color:#fff}
.note{text-align:center;color:var(--sub);font-size:.8rem;margin-top:30px}
</style>
</head>
<body>
